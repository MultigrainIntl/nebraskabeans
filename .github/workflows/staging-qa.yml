name: NebraskaBeans staging QA

on:
  push:
    branches: [gh-pages, 'staging/**']

permissions:
  contents: read

concurrency:
  group: nebraskabeans-staging-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify staging-only architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/site.js
          test ! -e assets/bean-regions.js
          test ! -e assets/map-refine.js
          test ! -e assets/visual-evidence.js
          ! grep -Eq 'assets/(site|bean-regions|map-refine|visual-evidence)\.js' index.html
          grep -q 'assets/app.js' index.html
          grep -q 'assets/source-registry.js' index.html
          grep -q 'assets/shell.js' commercial.html

      - name: Verify governed foundation and build identity
        run: |
          node scripts/build_manifest.mjs --check
          node scripts/verify_foundation.mjs

      - name: Run evidence regression tests
        run: |
          node tests/temporal-evidence.test.js
          node tests/evidence-store.test.js

      - name: Install Chromium verifier
        run: |
          npm install --no-save playwright@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium

      - name: Render exact checkout locally
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/nebraskabeans-http.log 2>&1 &
          echo $! >/tmp/nebraskabeans-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          NB_OFFLINE_FIXTURES=1 NB_BASE_URL='http://127.0.0.1:4173/' node tests/browser-smoke.mjs

      - name: Verify deployed GitHub Pages rendering
        if: github.ref == 'refs/heads/gh-pages'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://multigrainintl.github.io/nebraskabeans/?qa=${GITHUB_SHA}"
          python3 tests/verify_deployed.py "$URL"
          NB_BASE_URL="$URL" node tests/browser-smoke.mjs

      - name: Report exact verified SHA
        run: |
          echo "VERIFIED_STAGING_SHA=${GITHUB_SHA}"
          echo "ROLLBACK_SHA=f1ac4880f3be04b3d2aa91fae710bfaa3ae625b4"
