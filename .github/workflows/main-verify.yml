name: NebraskaBeans main policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nebraskabeans-main-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Enforce main branch inventory
        shell: bash
        run: |
          set -euo pipefail

          unexpected="$(
            git ls-files |
              grep -Ev '^(README\.md|CLAUDE\.md|\.github/workflows/main-verify\.yml|\.github/workflows/joieos-compliance\.yml|\.github/workflows/daily-refresh\.yml|\.github/CODEOWNERS)$' ||
              true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Files prohibited on main:"
            echo "$unexpected"
            exit 1
          fi

          test -f README.md
          test ! -L README.md
          test -f .github/workflows/main-verify.yml
          test ! -L .github/workflows/main-verify.yml
          test -f .github/CODEOWNERS
          test ! -L .github/CODEOWNERS
          # Scheduled workflows only run from the default branch, so the daily data refresh
          # has to live here even though everything it touches lives on gh-pages. If it goes
          # missing, the site silently stops updating and nothing says so — which is the exact
          # failure the job exists to prevent.
          test -f .github/workflows/daily-refresh.yml
          test ! -L .github/workflows/daily-refresh.yml
