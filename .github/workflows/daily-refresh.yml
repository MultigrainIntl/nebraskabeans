name: Daily data refresh

# Rebuilds every dataset the site shows, every morning, and FAILS LOUDLY if a source has
# stopped answering — rather than letting the site serve last month's crop as today's.
#
# That is not hypothetical. The USGS groundwater API was frozen on 1 November 2025 and now
# returns a redirect; anything still pointed at it receives a web page instead of data and
# reports nothing wrong. This job exists so that cannot happen quietly here.
#
# Every source is keyless. No secrets to configure, and nothing that can expire.

on:
  schedule:
    - cron: '20 11 * * *'      # 05:20 Mountain — after the overnight satellite passes land
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet numpy pillow shapely

      - name: Rebuild every dataset
        run: python3 scripts/refresh/run.py

      - name: Report freshness
        if: always()
        run: cat assets/data/refresh-status.json

      # VERIFY BEFORE PUBLISHING. Until 16 September 2026 this workflow pushed new data to the
      # live site every morning without running a single check. Everything in scripts/
      # verify_data.py only ran when someone ran it by hand. A source that changes format, or a
      # parse that starts reading the wrong column, would have published silently — which is
      # exactly how an all-crops row once became a dry bean yield.
      - name: Verify the data before it goes anywhere
        if: success()
        run: python3 scripts/verify_data.py

      - name: Publish the new data
        if: success()
        run: python3 scripts/refresh/publish.py

      - name: Say plainly that the data failed verification
        if: failure()
        run: |
          echo "::error::A dataset failed verification and was NOT published."
          echo "::error::The site is serving yesterday's data, which is correct behaviour."
          echo "::error::The check that failed is named above; each compares against a source"
          echo "::error::that did not produce the data."


      - name: Say plainly that the data is stale
        if: failure()
        run: |
          echo "::error::A source stopped answering, or a dataset fell behind its tolerance."
          echo "::error::The site was NOT updated and is now older than it claims."
          echo "::error::The freshness report above names which dataset and which source."
