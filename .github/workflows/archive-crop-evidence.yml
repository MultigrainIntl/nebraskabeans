name: Assemble crop evidence source archive
on:
  push:
    branches: ['staging/crop-weighted-evidence']
    paths:
      - 'assets/data/crop-evidence/crop-weighted-evidence.json'
      - 'scripts/archive_crop_sources.py'
      - '.github/workflows/archive-crop-evidence.yml'
permissions:
  contents: write
concurrency:
  group: crop-evidence-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/staging/crop-weighted-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and verify immutable public source bytes
        run: python scripts/archive_crop_sources.py
      - name: Check assembled build identity
        run: node scripts/build_manifest.mjs --check
      - name: Commit archive on this isolated branch
        run: |
          test "$GITHUB_REF_NAME" = 'staging/crop-weighted-evidence'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/crop-evidence/raw
          git diff --cached --quiet || git commit -m 'Archive checksummed native crop evidence source bytes'
      - name: Test exact assembled commit
        run: |
          node scripts/verify_foundation.mjs
          node tests/temporal-evidence.test.js
          node tests/evidence-store.test.js
          npm install --no-save playwright@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/crop-evidence-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          NB_OFFLINE_FIXTURES=1 node tests/browser-smoke.mjs
      - name: Publish only the verified archive branch
        run: |
          test "$GITHUB_REF_NAME" = 'staging/crop-weighted-evidence'
          git push origin HEAD:refs/heads/staging/crop-weighted-evidence
          git rev-parse HEAD
