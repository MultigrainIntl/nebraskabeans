parked_findings:
  - id: R-3
    status: PARKED_OPEN
    title: Verification fields may be present but empty
    reproduction:
      - Create an otherwise valid verification record for a requirement with an exact existing candidate SHA.
      - Set identity_provenance, timestamp, evidence, and limitations to empty strings.
      - Reference the record from the requirement and run node scripts/validate-control-plane.mjs.
    observed_or_expected_result: The lost CONTROL-VERIFY-003 non-empty checks allow the empty evidence fields instead of rejecting them.
  - id: R-4
    status: PARKED_OPEN
    title: Approval countersignature fields may be present but empty
    reproduction:
      - Introduce a new non-legacy approval in an approval-only commit.
      - Include countersigned_by and signature_provenance keys with empty values.
      - Run node scripts/validate-control-plane.mjs.
    observed_or_expected_result: Key presence is checked, but the lost CONTROL-APPROVAL-010 non-empty check is not consistently enforced.
  - id: R-5
    status: PARKED_RETEST_REQUIRED
    title: Protected-target allow and prohibit contradiction check was lost
    reproduction:
      - Add the same protected target to both scope.allow and scope.prohibit in the active approval and execution lock.
      - Run node scripts/validate-control-plane.mjs and inspect whether CONTROL-SCOPE-002 is emitted.
    observed_or_expected_result: The explicit CONTROL-SCOPE-002 check was removed. S-1 now rejects unmatched scope spellings, so this finding requires a fresh scoped reproduction before any future fix.
  - id: R-6
    status: PARKED_OPEN
    title: Exact nested-schema validation was lost
    reproduction:
