    implementation_sha: null
    implementer: ChatGPT
    independent_verification_record: null
    gaj_acceptance_required: true
    gaj_acceptance_record: null
    acceptance:
      - machine-readable precedence and state-transition rules exist
      - exactly one active gate is mechanically enforced
      - active gate must exist in canonical requirements
      - verification must bind an exact candidate SHA
      - independent verifier must differ from implementer
      - GAJ acceptance cannot precede independent verification
      - execution scope is explicitly locked
      - production authorization is explicit and fail-closed
      - contradictory evidence has a defined downgrade path
      - validator includes negative self-tests that deliberately fail invalid states
      - product files gh-pages and main remain unchanged
  - id: UX-001
    priority: P0
    requirement: Opening interface is immediately understandable and map-dominant rather than a long repetitive analytical page.
    status: FAILED
    evidence: GAJ screenshots and direct observation showed excessive complexity after prior claimed simplification.
    gaj_acceptance_required: true
    acceptance: [map near top, concise opening crop state, progressive disclosure, obvious primary view and temporal controls, advanced controls secondary, intentional desktop tablet phone hierarchy, no important agricultural intelligence lost]
  - id: MAP-001
    priority: P0
    requirement: Temporal moisture surface is visually interpretable without distracting coarse blockiness while preserving honest native-resolution disclosure.
    status: FAILED
    evidence: GAJ screenshot showed visible coarse raster cells after prior implementation claims.
    gaj_acceptance_required: true
    acceptance: [diagnose source-to-browser pipeline, document smoothing or interpolation, disclose native measurement resolution, imply no false precision, visually inspect desktop tablet phone maps]
  - id: YIELD-001
    priority: P0
