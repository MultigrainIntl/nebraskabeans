    gaj_acceptance_required: true
    acceptance: [audit model inputs calibration validation and leakage, establish historical and out-of-sample skill, quantify uncertainty and regional bias, incorporate defensible crop-response evidence, justify displayed precision]
  - id: MAP-002
    priority: P0
