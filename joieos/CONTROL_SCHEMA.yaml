schema_version: 2
precedence:
  - current_explicit_GAJ_approval
  - joieos_governance
  - live_repository_truth_and_exact_git_shas
  - requirements
  - current_state
  - approval_records
  - verification_records
  - contradiction_and_decision_records
  - generated_human_summaries
  - chat_history
rules:
  exactly_one_active_gate: true
  active_gate_must_exist: true
  approval_must_bind_exact_sha_when_sha_exists: true
  verification_must_bind_exact_sha: true
  deployed_verification_requires_deployed_sha: true
  independent_verifier_must_differ_from_implementer: true
  gaj_acceptance_requires_independent_verification: true
  contradictory_evidence_reopens_requirement: true
  branch_name_never_substitutes_for_sha: true
  production_requires_explicit_GAJ_authorization: true
  stale_verification_after_candidate_change: true
  control_files_must_not_self_reference_containing_commit: true
fail_closed: true
